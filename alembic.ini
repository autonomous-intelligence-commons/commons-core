# Alembic configuration for commons-core.
#
# The database URL is NOT hardcoded here: migrations/env.py reads it from
# AIC_DATABASE_URL (via commons-core settings), so the same checked-in file
# works for local SQLite and production PostgreSQL.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# URL is resolved programmatically in env.py; leave unset here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
