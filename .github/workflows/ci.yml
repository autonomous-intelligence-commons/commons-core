# AIC Phase 1 continuous integration.
#
# Original jobs (lint / test / migrate-check / dependency-audit) were prepared
# in Phase 1 and have RUN SUCCESSFULLY on GitHub since the repository was
# published. The Phase 1 hardening pass adds:
#   postgres — REAL PostgreSQL 16 service container: alembic
#              upgrade/downgrade/upgrade round-trip + the FULL test suite
#              against PostgreSQL via AIC_TEST_DATABASE_URL (fail-loud: the
#              suite aborts rather than falling back to SQLite).
#   docker   — REAL container build + compose stack verification: non-root
#              user, fail-closed production startup, postgres+migrate+api+
#              worker startup order, authenticated API smoke, deterministic
#              worker task execution, port-exposure audit, clean teardown.
#
# Spec §30 requirements covered:
#   lint            — formatting + linting (ruff, pinned to project version)
#   test            — unit + integration + security + privacy + recovery (pytest, SQLite)
#   postgres        — PostgreSQL-backed migrations + the full suite (Task 1)
#   docker          — image build + compose startup smoke test (Task 2)
#   migrate-check   — alembic upgrade/downgrade/upgrade round-trip (SQLite)
#   dependency-audit— pip-audit (NON-BLOCKING by design; see its comment)
# Static analysis beyond ruff is covered by ruff's rule set (E,F,W,I,UP,B).
#
# Security posture (spec §23 GitHub Actions):
#   - least-privilege permissions (contents: read, nothing else)
#   - NO secrets are used or required by CI (synthetic fixtures only — the
#     docker job generates a random test key at runtime and never commits it)
#   - actions/checkout pinned by commit SHA; other actions tracked via tags
#     (TODO for maintainers: pin setup-python/upload-artifact to commit SHAs
#     after their first verified run — Dependabot will propose updates)
#   - the docker job uses ONLY preinstalled runner tooling (docker CLI,
#     curl, python3) — no third-party Actions are invoked at all
#   - NO deploy job: Railway deployment requires SEPARATE authorization
#     (spec §31); CI must never auto-deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # TODO: pin to commit SHA after first verified run
        with:
          python-version: "3.12"
      - name: Install ruff (project pin)
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.1
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (pytest — functional, security, privacy, recovery)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # TODO: pin to commit SHA after first verified run
        with:
          python-version: "3.12"
      # ".[dev,postgres]": the suite includes production fail-closed startup
      # tests that build a real SQLAlchemy engine for a postgresql+psycopg://
      # URL (tests/security/test_production_key_management.py). Importing the
      # psycopg dialect requires the driver even though the tests never
      # connect — without the extra they fail with ModuleNotFoundError.
      - name: Install application + dev + postgres dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Run the deterministic test suite (no network, no real AI)
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload test results
        if: always() # upload even when tests fail, for triage
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA after first verified run
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: error

  postgres:
    name: PostgreSQL 16 integration (migrations + full suite)
    runs-on: ubuntu-latest
    # HONEST scope: executes against a REAL PostgreSQL 16 service container.
    # The suite is pointed at PostgreSQL via AIC_TEST_DATABASE_URL and ABORTS
    # (pytest.UsageError) if the server is unreachable or misconfigured —
    # there is NO silent SQLite fallback (tests/conftest.py::_backend_guard).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commons
          POSTGRES_PASSWORD: commons-ci
          POSTGRES_DB: commons
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commons -d commons"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      AIC_DATABASE_URL: postgresql+psycopg://commons:commons-ci@localhost:5432/commons
      AIC_TEST_DATABASE_URL: postgresql+psycopg://commons:commons-ci@localhost:5432/commons
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # TODO: pin to commit SHA after first verified run
        with:
          python-version: "3.12"
      - name: Install application + dev + postgres dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Apply all migrations (PostgreSQL)
        run: alembic upgrade head
      - name: Verify the migrated PostgreSQL schema
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          engine = create_engine("postgresql+psycopg://commons:commons-ci@localhost:5432/commons")
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          expected = {
              "agents", "agent_credentials", "channels", "channel_members",
              "messages", "message_acks", "memory_namespaces", "memory_permissions",
              "memory_entries", "activities", "activity_members", "governance_records",
              "scheduled_tasks", "security_events", "system_state", "quota_counters",
          }
          missing = expected - tables
          assert not missing, f"missing tables after migration: {sorted(missing)}"
          print(f"schema OK: {len(tables)} tables (incl. alembic_version)")
          # unique indexes enforced by the migration
          indexes = {i["name"] for i in inspector.get_indexes("scheduled_tasks")}
          assert "ix_scheduled_tasks_idempotency_key" in indexes, indexes
          print("idempotency unique index OK")
          PY
      - name: Roll back to base (PostgreSQL)
        run: alembic downgrade base
      - name: Re-apply all migrations (round-trip, PostgreSQL)
        run: alembic upgrade head
      - name: Run the FULL suite against PostgreSQL (no fallback)
        run: python -m pytest -q --junitxml=pytest-pg-results.xml
      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA after first verified run
        with:
          name: pytest-pg-results
          path: pytest-pg-results.xml
          if-no-files-found: error

  docker:
    name: Docker build & compose smoke (real containers)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons-ci
      POSTGRES_DB: commons
      AIC_API_PORT: "8010"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
      - name: Build the production image
        run: docker build -t commons-core:ci .
      - name: Confirm the image runs as a non-root user
        run: |
          id_output=$(docker run --rm --entrypoint id commons-core:ci)
          echo "$id_output"
          echo "$id_output" | grep -q "uid=1001(appuser)" || {
            echo "FAIL: container does not run as appuser (uid 1001)"; exit 1; }
          echo "OK: non-root appuser (uid 1001)"
      - name: Fail-closed production startup (missing keys must refuse)
        run: |
          set +e
          docker run --rm -e AIC_ENV=production \
            -e AIC_DATABASE_URL='postgresql+psycopg://commons:commons-ci@unreachable.invalid:5432/commons' \
            commons-core:ci
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: production started WITHOUT AIC_MASTER_KEYS"; exit 1; fi
          echo "OK: production startup refused without keys (exit $rc)"
      - name: Generate a synthetic test key (never committed, never reused)
        run: |
          key="k1:$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "AIC_MASTER_KEYS=$key" >> "$GITHUB_ENV"
      - name: Validate the compose configuration
        run: |
          printf 'AIC_MASTER_KEYS=%s\nPOSTGRES_USER=commons\nPOSTGRES_PASSWORD=commons-ci\nPOSTGRES_DB=commons\n' \
            "$AIC_MASTER_KEYS" > .env
          docker compose config -q && echo "compose config valid"
      - name: Confirm ONLY the API service publishes a host port
        run: |
          docker compose config --format json | python3 -c '
          import json, sys
          cfg = json.load(sys.stdin)
          def normalize(value):
              # docker compose reports published host ports as STRINGS when
              # they originate from environment interpolation (${AIC_API_PORT})
              # and as integers when they come from literal YAML — normalize
              # to int before comparing (security check must be type-stable).
              return int(value) if value is not None else None
          published = {
              name: [normalize(p.get("published")) for p in svc.get("ports", [])]
              for name, svc in cfg["services"].items()
          }
          offenders = {n: p for n, p in published.items() if p}
          assert offenders == {"api": [8010]}, offenders
          print("port exposure OK: only api publishes 8010")
          '
      - name: Verify compose-injected DB credentials match the postgres service
        # The postgres healthcheck (pg_isready) proves the server is UP but
        # never exercises password authentication — a credential mismatch in
        # the compose topology otherwise only surfaces when migrate tries to
        # connect (PR #5: "FATAL: password authentication failed for user
        # \"commons\"" — caused by a stray ${POSTGRES_DB} interpolated into
        # the URL userinfo, corrupting the password). This assertion parses
        # the RESOLVED compose config BEFORE any container starts and proves
        # the URL userinfo equals the postgres service credentials (password
        # in canonical percent-encoded form), that migrate/api/worker share
        # ONE URL, and that both match the CI job intent. PRIVACY: on
        # mismatch only component NAMES are printed — usernames, passwords
        # and the URL itself are never echoed.
        run: |
          docker compose config --format json | python3 -c '
          import json, os, sys
          from urllib.parse import quote, unquote, urlsplit

          cfg = json.load(sys.stdin)
          pg = cfg["services"]["postgres"]["environment"]
          url = cfg["services"]["migrate"]["environment"]["AIC_DATABASE_URL"]

          problems = []
          # 1) the credentials the POSTGRES CONTAINER is initialized with
          #    must equal what the APP SERVICES will connect with.
          parts = urlsplit(url)
          if unquote(parts.username or "") != pg["POSTGRES_USER"]:
              problems.append("URL username != postgres POSTGRES_USER")
          # The URL password must be the CANONICAL percent-encoding of the
          # postgres password: this catches BOTH wrong values (the PR #5
          # incident — a stray ${POSTGRES_DB} term corrupted the userinfo)
          # AND special characters inserted raw instead of encoded (RFC 3986:
          # a raw '@' silently re-parses as a host separator, ':' as a
          # username/password delimiter).
          if (parts.password or "") != quote(pg["POSTGRES_PASSWORD"], safe=""):
              problems.append("URL password != canonical percent-encoding of postgres POSTGRES_PASSWORD")
          if (parts.path or "").lstrip("/") != pg["POSTGRES_DB"]:
              problems.append("URL database != postgres POSTGRES_DB")
          if parts.scheme != "postgresql+psycopg":
              problems.append("URL scheme is not postgresql+psycopg")

          # 2) single source of truth: all app services share ONE URL.
          for svc in ("api", "worker"):
              if cfg["services"][svc]["environment"]["AIC_DATABASE_URL"] != url:
                  problems.append(f"{svc} AIC_DATABASE_URL differs from migrate")

          # 3) the resolved values must match the CI job intent.
          for var, key in (("POSTGRES_USER", "POSTGRES_USER"),
                           ("POSTGRES_PASSWORD", "POSTGRES_PASSWORD"),
                           ("POSTGRES_DB", "POSTGRES_DB")):
              intended = os.environ.get(var)
              if intended is not None and intended != pg[key]:
                  problems.append(f"postgres {key} != CI env {var}")

          assert not problems, "database credential mismatch: " + "; ".join(problems)
          print("compose DB credentials consistent: postgres <-> migrate/api/worker <-> CI env (values never printed)")
          '
      - name: Start the full stack (postgres → migrate → api + worker)
        run: docker compose up -d --build
      - name: Confirm migrations completed before dependent services
        run: |
          container=$(docker compose ps -aq migrate)
          code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          state=$(docker inspect --format '{{.State.Status}}' "$container")
          echo "migrate service: status=$state exit=$code"
          [ "$state" = "exited" ] && [ "$code" = "0" ] || {
            docker compose logs migrate; exit 1; }
      - name: Wait for the API health endpoint
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:8010/health" >/dev/null 2>&1; then
              echo "API healthy after $i polls"; exit 0; fi
            sleep 2
          done
          echo "API never became healthy"; docker compose logs api; exit 1
      - name: Authenticated API smoke test (health → 401 → provision → me → task)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8010/api/v1/admin/telemetry)
          [ "$code" = "401" ] || { echo "FAIL: telemetry must be 401 unauthenticated, got $code"; exit 1; }
          echo "unauthenticated telemetry -> 401 OK"
          docker compose exec -T api python scripts/manage.py provision --handle ci-smoke > provision.out
          TOKEN=$(tail -1 provision.out | tr -d ' ')
          [ "${#TOKEN}" -ge 20 ] || { echo "FAIL: no token provisioned"; cat provision.out; exit 1; }
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8010/api/v1/agents/me \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["handle"]=="ci-smoke"; print("agents/me OK")'
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"kind":"noop","payload":{"ci":true}}' http://localhost:8010/api/v1/tasks \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="pending"; print("task submitted OK")'
      - name: Verify the worker processes a deterministic task
        run: |
          TOKEN=$(tail -1 provision.out | tr -d ' ')
          for i in $(seq 1 45); do
            status=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8010/api/v1/tasks \
              | python3 -c 'import json,sys; ts=json.load(sys.stdin)["tasks"]; ts=[t for t in ts if t["kind"]=="noop"]; print(ts[0]["status"] if ts else "none")')
            if [ "$status" = "succeeded" ]; then echo "worker processed the task OK"; exit 0; fi
            sleep 2
          done
          echo "worker never completed the task (status=$status)"; docker compose logs worker; exit 1
      - name: Verify the worker is alive and idle (no HTTP API by design)
        run: |
          docker compose ps worker | grep -q "Up" || { docker compose logs worker; exit 1; }
          echo "worker running (no HTTP healthcheck — by design, spec §16)"
      - name: Diagnose failing services (sanitized migrate/postgres logs)
        # Runs on ANY docker-job failure, BEFORE cleanup removes containers,
        # so the actual migrate traceback is preserved in the job log.
        # PRIVACY: output is redacted — DB URLs (user:password@), password
        # assignments, AIC_MASTER_KEYS values and 64-hex key material are
        # masked; docker inspect is restricted to state fields only (Env is
        # never printed). Diagnostics must never mask the original failure.
        if: failure()
        run: |
          echo "::group::Service states (docker compose ps -a)"
          docker compose ps -a || true
          echo "::endgroup::"
          echo "::group::Container exit status and state (state fields only — Env never printed)"
          for svc in postgres migrate api worker; do
            cid=$(docker compose ps -aq "$svc" 2>/dev/null)
            if [ -n "$cid" ]; then
              docker inspect --format '{{.Name}}: status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}} error={{.State.Error}}' "$cid" || true
            else
              echo "$svc: no container on this project"
            fi
          done
          echo "::endgroup::"
          echo "::group::migrate + postgres logs (credentials redacted)"
          docker compose logs --no-color --timestamps --tail 400 migrate postgres 2>&1 | sed -E \
            -e 's#(://[^:/@[:space:]]+:)[^@[:space:]]+@#\1***@#g' \
            -e 's#([Pp]assword[[:space:]]*[:=][[:space:]]*)[^[:space:]]+#\1***#g' \
            -e 's#(POSTGRES_PASSWORD|AIC_MASTER_KEYS|AIC_DATABASE_URL)=[^[:space:]]+#\1=***REDACTED***#g' \
            -e 's#\b[0-9a-f]{64}\b#***HEX64-REDACTED***#g' \
            || true
          echo "::endgroup::"
      - name: Shut down cleanly and remove containers + volumes
        if: always()
        run: |
          docker compose down -v --remove-orphans --timeout 20
          remaining=$(docker compose ps -q | wc -l)
          [ "$remaining" = "0" ] && echo "clean teardown OK" || {
            echo "FAIL: $remaining containers remain"; exit 1; }

  migrate-check:
    name: Alembic migration round-trip (SQLite)
    runs-on: ubuntu-latest
    env:
      AIC_DATABASE_URL: "sqlite+pysqlite:////tmp/migrate-check.db"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # TODO: pin to commit SHA after first verified run
        with:
          python-version: "3.12"
      - name: Install application (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Apply all migrations
        run: alembic upgrade head
      - name: Roll back to base
        run: alembic downgrade base
      - name: Re-apply all migrations
        run: alembic upgrade head

  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    # NON-BLOCKING by design: pip-audit may report advisories in transitive
    # dependencies or OS-level packages that do not affect this threat model;
    # blocking CI on untriageable noise would stop development. Findings are
    # made VISIBLE three ways: full output in the job log, a JSON report
    # uploaded as an artifact, and the documented triage process in
    # docs/SECURITY_CONTROLS.md (supply-chain section). Advisories must be
    # triaged via the (blocking) review process and Dependabot alerts.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # TODO: pin to commit SHA after first verified run
        with:
          python-version: "3.12"
      - name: Install application + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit==2.10.1
      - name: Audit the installed third-party dependencies (report visible, non-blocking)
        run: |
          set -o pipefail
          # commons-core is installed EDITABLE and is NOT published on PyPI:
          # auditing the live environment makes pip-audit resolve it against
          # PyPI and abort with "Dependency not found on PyPI". Instead, freeze
          # the environment WITHOUT the local project into a fully-pinned
          # lockfile and audit exactly that (every installed third-party
          # dependency, including pip-audit's own tree).
          # (report removed up-front so a stale file can never be mistaken
          # for a fresh vulnerability finding below)
          rm -f pip-audit-report.json
          python -m pip freeze --exclude-editable \
            | grep -vE '^(#|-e|pkg-resources==)' \
            > requirements-audit.lock
          # Fail-loud guard: a broken/partial freeze must not silently shrink
          # the audit surface to a near-empty lockfile (fake-green scan).
          count=$(grep -c . requirements-audit.lock || true)
          if [ "$count" -lt 20 ]; then
            echo "::error::pip freeze produced only $count pinned dependencies — refusing to audit an incomplete environment"
            exit 2
          fi
          echo "auditing $count pinned third-party dependencies"
          set +e
          pip-audit --requirement requirements-audit.lock --no-deps --strict \
            --format json --output pip-audit-report.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "pip-audit: scan complete — no known vulnerabilities"
          elif [ -f pip-audit-report.json ]; then
            echo "::warning::pip-audit reported advisories — see the pip-audit-report artifact and docs/SECURITY_CONTROLS.md (triage process)"
            exit 1
          else
            echo "::error::pip-audit failed to complete (exit $rc, no report produced) — scan execution error, not a vulnerability finding"
            exit 2
          fi
      - name: Upload the audit report (always, even with findings)
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA after first verified run
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn

  # NO DEPLOY JOB — DELIBERATE.
  # Spec §31: "Do not deploy to Railway. All deployment actions require
  # separate user authorization after Phase 1." Railway deployment must be
  # performed manually per docs/DEPLOYMENT.md once authorized.
