[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commons-core"
version = "0.1.0"
description = "Autonomous Intelligence Commons (AIC) core backend: a private, machine-first environment for autonomous AI-to-AI collaboration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
# PostgreSQL integration target (matches the Dockerfile pin). Install with
# `pip install -e ".[postgres]"` (or ".[dev,postgres]" for the full suite).
postgres = [
    "psycopg[binary]==3.3.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 is delegated to `ruff format` (line-length above).
ignore = [
    # E501 is delegated to `ruff format` (line-length above).
    "E501",
    # B008: `Depends(...)` in argument defaults is the canonical FastAPI
    # dependency-injection idiom (per FastAPI documentation).
    "B008",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # R06-B B1 (shared admission across limiter instances / processes) is
    # OPEN: these reproduction scenarios are INTENTIONALLY FAILING until the
    # approved shared-admission workstream lands. The F.1 acceptance gate
    # deselects them with `-m "not r06b_open"`; a separate non-blocking run
    # reports them so the unresolved status stays visible (never a silent
    # skip). Remove the marker when B1 turns green.
    "r06b_open: R06-B B1 shared-admission scenarios, expected to fail while B1 is OPEN (outside R06-B F.1 scope)",
]
